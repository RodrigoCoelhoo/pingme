  <rect x="648" y="337" width="155" height="60" rx="7" fill="#ffffff" stroke="#4ade80" stroke-width="1.5"/>
  <text x="725" y="358" text-anchor="middle" fill="#15803d" font-size="11" font-weight="700">Monitoring</text>
