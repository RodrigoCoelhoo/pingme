  <rect x="48" y="107" width="144" height="50" rx="7" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="120" y="127" text-anchor="middle" fill="#1e40af" font-size="11" font-weight="600">User Browser</text>
  <text x="120" y="146" text-anchor="middle" fill="#64748b" font-size="9">Interacts via UI</text>

  <line x1="120" y1="157" x2="120" y2="172" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#ab)"/>

