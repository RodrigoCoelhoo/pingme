  <text x="848" y="255" fill="#ea580c" font-size="8" transform="rotate(-78,848,255)">scrapes</text>

  <!-- ═══ CI PIPELINE ═══ -->
  <rect x="870" y="330" width="200" height="130" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
