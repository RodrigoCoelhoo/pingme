  <rect x="888" y="185" width="164" height="58" rx="7" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="970" y="205" text-anchor="middle" fill="#c2410c" font-size="11" font-weight="700">Grafana</text>
  <text x="970" y="222" text-anchor="middle" fill="#64748b" font-size="9">Dashboards</text>
  <text x="970" y="235" text-anchor="middle" fill="#94a3b8" font-size="8">Port 3001</text>

  <!-- Prometheus scrapes Monitoring -->
