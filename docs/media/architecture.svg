  <rect x="278" y="496" width="525" height="12" fill="#166534"/>
  <text x="540" y="498" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700" letter-spacing="1">MONGODB  ·  Port 27017</text>
  <text x="540" y="530" text-anchor="middle" fill="#15803d" font-size="10" font-weight="600">users · chats · messages · contacts · memberships</text>
  <text x="540" y="550" text-anchor="middle" fill="#64748b" font-size="9">Spring Data MongoDB</text>



  <!-- ═══ OBSERVABILITY ═══ -->
