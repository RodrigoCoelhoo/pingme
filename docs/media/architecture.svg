  <line x1="192" y1="440" x2="278" y2="367" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ap)" marker-start="url(#apb)"/>
  <text x="222" y="413" text-anchor="middle" fill="#7c3aed" font-size="8">OAuth Flow</text>

  <!-- DOCKER FOOTER -->
  <rect x="30" y="690" width="1040" height="52" rx="8" fill="#f0f9ff" stroke="#2496ed" stroke-width="1.5" stroke-dasharray="7,4"/>
