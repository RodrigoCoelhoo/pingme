  <text x="970" y="393" text-anchor="middle" fill="#1d4ed8" font-size="11" font-weight="700">GitHub Actions</text>
  <text x="970" y="410" text-anchor="middle" fill="#64748b" font-size="9">Build · Health Check</text>
  <text x="970" y="424" text-anchor="middle" fill="#64748b" font-size="9">Docker Compose</text>

  <!-- ═══ CONNECTIONS ═══ -->

  <!-- React → REST (HTTP, blue dashed, arrow hits top area of REST) -->
  <line x1="192" y1="185" x2="278" y2="125" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ab)"/>
  <text x="218" y="160" text-anchor="middle" fill="#3b82f6" font-size="8">HTTP REST</text>

  <!-- React ↔ WebSocket (orange dotted, no label) -->
  <line x1="192" y1="215" x2="463" y2="155" stroke="#f97316" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#art)" marker-start="url(#artb)"/>

  <!-- Cloudinary ↔ App Services -->
  <line x1="192" y1="367" x2="355" y2="265" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ap)" marker-start="url(#apb)"/>
  <text x="248" y="325" text-anchor="middle" fill="#7c3aed" font-size="8">Uploads</text>

